  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center;

  .bar {
    width: 100%; max-width: 420px; display: flex; align-items: center; gap: 12px;

    box-shadow: 0 8px 20px rgba(255,200,0,.25), inset 0 1px 0 rgba(255,255,255,.7);

  .grid {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  /* Rotating LED halo: a conic-gradient ring spins behind each card */
  .qism {
    position: relative; border-radius: 20px; padding: 3px; text-decoration: none; color: var(--text);
    background: conic-gradient(from var(--a), #ff3b6b, #ffb020, #ffe600, #39e07a, #20c8ff, #5b5bff, #d43bff, #ff3b6b);
    animation: spin 4s linear infinite;
    animation-delay: var(--d, 0s);
    box-shadow: 0 0 14px rgba(255,190,60,.35);
  }
  @keyframes spin { to { --a: 360deg; } }
  .qism-in {
    background: #fff; border-radius: 17px; padding: 20px 18px; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 110px;
  }
  .qism-title { font-size: 24px; font-weight: 800; color: #1d2433; }
  .qism-meta { font-size: 15px; color: var(--muted); margin-top: 10px; }
  .qism:active { transform: translateY(3px); }
