<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellashuv · o'qituvchi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="hanja-data.js?v=16"></script>
<script src="bellashuv-core.js?v=1"></script>
<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; --accent:#534AB7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  h1 { font-size:20px; margin:0 0 14px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(31,45,80,.08); }
  .lessons { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .lessons label { border:1px solid #dde3ec; border-radius:12px; padding:8px; font-size:14px; display:flex; gap:6px; align-items:center; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  select, button { font-size:16px; padding:10px 14px; border-radius:12px; border:1px solid #c9d3e0; }
  button.primary { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  button.ghost { background:#fff; cursor:pointer; }
  .code { font-size:40px; font-weight:800; letter-spacing:6px; text-align:center; margin:6px 0; }
  .link { font-size:13px; color:var(--muted); word-break:break-all; text-align:center; }
  #qr { display:flex; justify-content:center; margin:12px 0; }
  .players { list-style:none; padding:0; margin:0; }
  .players li { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid #eef1f6; font-size:16px; }
  .msg { color:#b93a2b; font-size:14px; min-height:18px; }
  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .groups button { background:#fff; text-align:center; line-height:1.3; }
  .groups button small { color:var(--muted); font-size:12px; font-weight:400; }
  .sub { font-size:14px; color:var(--muted); margin:0 0 10px; }
</style>
</head>
<body>
  <h1>Bellashuv · sozlash</h1>

  <div class="card" id="setup">
    <div id="step1">
      <p style="margin:0 0 10px;font-weight:600;">Guruhni tanlang</p>
      <div class="groups" id="groups"></div>
    </div>
    <div id="step2" style="display:none;">
      <button class="ghost" id="backBtn" type="button">← Guruhlar</button>
      <p style="margin:12px 0 4px;font-weight:600;" id="groupTitle"></p>
      <p class="sub">Eng ko'pi bilan 3 ta dars tanlang</p>
      <div class="lessons" id="lessons"></div>
    </div>
    <div class="row">
      <label>Vaqt (soniya)
        <select id="time">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="7">7</option>
          <option value="10">10</option>
        </select>
      </label>
      <label>Daraja
        <select id="level">
          <option value="1">Boshlang'ich</option>
          <option value="2">O'rta</option>
          <option value="3">Yuqori</option>
        </select>
      </label>
    </div>
    <div class="row"><button class="primary" id="createBtn" type="button">Xona yaratish</button></div>
    <p class="msg" id="msg"></p>
  </div>

  <div class="card" id="roomCard" style="display:none;">
    <p style="margin:0;text-align:center;color:var(--muted);">Xona kodi</p>
    <div class="code" id="code">----</div>
    <div id="qr"></div>
    <p class="link" id="link"></p>
    <p style="margin:12px 0 6px;font-weight:600;">O'yinchilar (<span id="count">0</span>)</p>
    <ul class="players" id="players"></ul>
    <div class="row">
      <button class="primary" id="startBtn" type="button">Boshlash</button>
      <button class="ghost" id="endBtn" type="button">Yakunlash</button>
    </div>
    <p class="msg" id="roomMsg"></p>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const MAX_LESSONS = 3;

  // Darslar mavjud kalitlar; har guruhda 5 ta dars (1–5, 6–10, ... 46–50)
  const lessonKeys = Object.keys(window.HANJA || {}).map(Number).sort((a, b) => a - b);
  const groups = [];
  for (let g = 1; g <= 10; g++) {
    const from = (g - 1) * 5 + 1, to = g * 5;
    groups.push({ g, from, to, keys: lessonKeys.filter(n => n >= from && n <= to) });
  }

  $('groups').innerHTML = groups.map(x =>
    `<button class="ghost" type="button" data-g="${x.g}">${x.g}-guruh<br><small>${x.from}–${x.to}-dars</small></button>`).join('');
  $('groups').addEventListener('click', e => {
    const b = e.target.closest('button[data-g]');
    if (b) showGroup(Number(b.dataset.g));
  });

  function showGroup(g) {
    const x = groups.find(k => k.g === g);
    if (!x) return;
    $('step1').style.display = 'none';
    $('step2').style.display = 'block';
    $('groupTitle').textContent = g + '-guruh (' + x.from + '–' + x.to + '-dars)';
    $('lessons').innerHTML = x.keys.map(n =>
      `<label><input type="checkbox" value="${n}"> ${n}-dars</label>`).join('');
    $('msg').textContent = '';
  }

  $('backBtn').onclick = () => {
    $('step2').style.display = 'none';
    $('step1').style.display = 'block';
    $('msg').textContent = '';
  };

  $('lessons').addEventListener('change', e => {
    const checked = [...document.querySelectorAll('#lessons input:checked')];
    if (checked.length > MAX_LESSONS) {
      e.target.checked = false;
      $('msg').textContent = "Eng ko'pi bilan 3 ta dars tanlash mumkin";
    } else {
      $('msg').textContent = '';
    }
  });

  // Bellashuv tugmasi guruh sahifasidan ?q=N bilan ochilsa, o'sha guruh to'g'ridan-to'g'ri chiqadi
  const qParam = Number(new URLSearchParams(location.search).get('q'));
  if (qParam) showGroup(qParam);

  let db = null, roomRef = null, code = null;
  try { db = BELL.init(); }
  catch (e) { $('msg').textContent = e.message; }

  $('createBtn').onclick = async () => {
    if (!db) return;
    const lessons = [...document.querySelectorAll('#lessons input:checked')].map(i => i.value);
    if (!lessons.length) { $('msg').textContent = "Kamida bitta bo'lim tanlang"; return; }
    $('msg').textContent = '';

    // Bo'sh xona kodini topish
    let c = BELL.randomCode();
    for (let i = 0; i < 10; i++) {
      const snap = await db.ref('rooms/' + c).once('value');
      if (!snap.exists()) break;
      c = BELL.randomCode();
    }
    code = c;
    roomRef = db.ref('rooms/' + code);
    await roomRef.set({
      status: 'lobby',
      lessons: lessons,
      time: Number($('time').value),
      level: Number($('level').value),
      createdAt: Date.now()
    });
    showRoom();
  };

  function showRoom() {
    $('setup').style.display = 'none';
    $('roomCard').style.display = 'block';
    $('code').textContent = code;
    const url = new URL('join.html?room=' + code, location.href).href;
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: url, width: 200, height: 200 });

    roomRef.child('players').on('value', snap => {
      const list = [];
      snap.forEach(ch => list.push(ch.val()));
      list.sort((a, b) => (b.score || 0) - (a.score || 0));
      $('count').textContent = list.length;
      $('players').innerHTML = list.map(p =>
        `<li><span>${p.avatar} ${escapeHtml(p.name)}</span><strong>${p.score || 0}</strong></li>`).join('');
    });
  }

  $('startBtn').onclick = () => {
    if (roomRef) roomRef.update({ status: 'started' });
    $('roomMsg').textContent = "O'yin boshlandi. O'quvchilar avtomatik boshlaydi.";
  };
  $('endBtn').onclick = () => {
    if (roomRef) roomRef.update({ status: 'ended' });
    $('roomMsg').textContent = "O'yin yakunlandi.";
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
</script>
</body>
</html>
