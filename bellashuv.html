<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellashuv · o'qituvchi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="hanja-data.js?v=16"></script>
<script src="bellashuv-core.js?v=1"></script>
<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; --accent:#534AB7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#CFF2E3; color:var(--text); padding:16px; }
  h1 { font-size:20px; margin:0 0 14px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(31,45,80,.08); }
  .lessons { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .lessons label { border:2px solid #7F77DD; border-radius:16px; padding:12px 8px; font-size:14px; font-weight:600; display:flex; gap:6px; align-items:center; justify-content:center; background:#fff; color:#26215C; box-shadow:0 5px 0 #c9d3e0; cursor:pointer; }
  .lessons label:has(input:checked) { background:linear-gradient(90deg,#534AB7,#7F77DD); color:#fff; border-color:rgba(200,195,255,.9); box-shadow:0 5px 0 #26215C, 0 0 14px rgba(127,119,221,.7); }
  .lessons input { accent-color:#26215C; }
  select { border:2px solid #7F77DD; background:#fff; color:#26215C; font-weight:600; border-radius:14px; }
  .btn3d { position:relative; display:block; width:100%; border:2px solid rgba(150,235,255,.9); border-radius:22px; padding:16px 14px; color:#fff; font-family:inherit; font-size:16px; font-weight:700; text-align:center; cursor:pointer; overflow:hidden; background:linear-gradient(90deg,#005ae6,#00bfff); box-shadow:0 8px 0 #0a2878, 0 0 16px rgba(0,170,255,.55), inset 0 1px 0 rgba(255,255,255,.45); transition:transform .12s ease, box-shadow .12s ease; }
  .btn3d::before { content:""; position:absolute; left:12px; right:12px; top:6px; height:44%; border-radius:16px; background:linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.05)); pointer-events:none; }
  .btn3d:active { transform:translateY(6px); box-shadow:0 2px 0 #0a2878, 0 0 12px rgba(0,170,255,.4); }
  .btn3d.purple { background:linear-gradient(90deg,#534AB7,#7F77DD); border-color:rgba(200,195,255,.9); box-shadow:0 8px 0 #26215C, 0 0 16px rgba(127,119,221,.6), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn3d.purple:active { box-shadow:0 2px 0 #26215C, 0 0 12px rgba(127,119,221,.4); }
  .btn3d.light { background:#fff; color:#26215C; border-color:#7F77DD; box-shadow:0 8px 0 #c9d3e0, 0 0 14px rgba(127,119,221,.35); }
  .btn3d.light:active { box-shadow:0 2px 0 #c9d3e0, 0 0 10px rgba(127,119,221,.3); }
  .btn3d small { display:block; font-size:12px; font-weight:600; opacity:.85; margin-top:4px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  select, button { font-size:16px; padding:10px 14px; border-radius:12px; border:1px solid #c9d3e0; }
  button.primary { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  button.ghost { background:#fff; cursor:pointer; }
  .code { font-size:40px; font-weight:800; letter-spacing:6px; text-align:center; margin:6px 0; }
  .link { font-size:13px; color:var(--muted); word-break:break-all; text-align:center; }
  #qr { display:flex; justify-content:center; margin:12px 0; }
  .players { list-style:none; padding:0; margin:0; }
  .players li { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid #eef1f6; font-size:16px; }
  .msg { color:#b93a2b; font-size:14px; min-height:18px; }
  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .sub { font-size:14px; color:var(--muted); margin:0 0 10px; }
</style>
</head>
<body>
  <h1>Bellashuv · sozlash</h1>

  <div class="card" id="setup">
    <div id="step1">
      <p style="margin:0 0 10px;font-weight:600;">Guruhni tanlang</p>
      <div class="groups" id="groups"></div>
    </div>
    <div id="step2" style="display:none;">
      <button class="btn3d light" id="backBtn" type="button" style="width:auto;display:inline-block;padding:10px 18px;border-radius:16px;font-size:14px;">← Guruhlar</button>
      <p style="margin:12px 0 4px;font-weight:600;" id="groupTitle"></p>
      <p class="sub">Eng ko'pi bilan 3 ta dars tanlang</p>
      <div class="lessons" id="lessons"></div>
    </div>
    <div class="row">
      <label>Vaqt (soniya)
        <select id="time">
          <option value="5" selected>5</option>
          <option value="7">7</option>
          <option value="10">10</option>
          <option value="15">15</option>
        </select>
      </label>
      <label>Daraja
        <select id="level">
          <option value="1">Boshlang'ich</option>
          <option value="2">O'rta</option>
          <option value="3">Yuqori</option>
        </select>
      </label>
    </div>
    <div class="row" style="display:block;"><button class="btn3d purple" id="createBtn" type="button">Xona yaratish</button></div>
    <p class="msg" id="msg"></p>
  </div>

  <div class="card" id="roomCard" style="display:none;">
    <p style="margin:0;text-align:center;color:var(--muted);">Xona kodi</p>
    <div class="code" id="code">----</div>
    <div id="qr"></div>
    <p class="link" id="link"></p>
    <p class="sub" id="phase" style="text-align:center;font-weight:600;"></p>
    <p style="margin:12px 0 6px;font-weight:600;">O'yinchilar (<span id="count">0</span>)</p>
    <ul class="players" id="players"></ul>
    <div class="row">
      <button class="btn3d" id="startBtn" type="button">Boshlash</button>
      <button class="btn3d light" id="endBtn" type="button">Yakunlash</button>
    </div>
    <p class="msg" id="roomMsg"></p>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const MAX_LESSONS = 3;

  // Yangi tugmalarga "pop" ovozi (index.html dagi bilan bir xil)
  let popCtx = null;
  function playPop() {
    try {
      if (!popCtx) popCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (popCtx.state === 'suspended') popCtx.resume();
      const t0 = popCtx.currentTime;
      const osc = popCtx.createOscillator();
      const gain = popCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, t0);
      osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.08);
      gain.gain.setValueAtTime(0.5, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
      osc.connect(gain).connect(popCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.09);
    } catch (e) {}
  }
  document.addEventListener('click', e => { if (e.target.closest('.btn3d')) playPop(); });

  // Darslar mavjud kalitlar; har guruhda 5 ta dars (1–5, 6–10, ... 46–50)
  const lessonKeys = Object.keys(window.HANJA || {}).map(Number).sort((a, b) => a - b);
  const groups = [];
  for (let g = 1; g <= 10; g++) {
    const from = (g - 1) * 5 + 1, to = g * 5;
    groups.push({ g, from, to, keys: lessonKeys.filter(n => n >= from && n <= to) });
  }

  $('groups').innerHTML = groups.map(x =>
    `<button class="btn3d purple" type="button" data-g="${x.g}">${x.g}-guruh<small>${x.from}–${x.to}-dars</small></button>`).join('');
  $('groups').addEventListener('click', e => {
    const b = e.target.closest('button[data-g]');
    if (b) showGroup(Number(b.dataset.g));
  });

  function showGroup(g) {
    const x = groups.find(k => k.g === g);
    if (!x) return;
    $('step1').style.display = 'none';
    $('step2').style.display = 'block';
    $('groupTitle').textContent = g + '-guruh (' + x.from + '–' + x.to + '-dars)';
    $('lessons').innerHTML = x.keys.map(n =>
      `<label><input type="checkbox" value="${n}"> ${n}-dars</label>`).join('');
    $('msg').textContent = '';
  }

  $('backBtn').onclick = () => {
    $('step2').style.display = 'none';
    $('step1').style.display = 'block';
    $('msg').textContent = '';
  };

  $('lessons').addEventListener('change', e => {
    const checked = [...document.querySelectorAll('#lessons input:checked')];
    if (checked.length > MAX_LESSONS) {
      e.target.checked = false;
      $('msg').textContent = "Eng ko'pi bilan 3 ta dars tanlash mumkin";
    } else {
      $('msg').textContent = '';
    }
  });

  // Bellashuv tugmasi guruh sahifasidan ?q=N bilan ochilsa, o'sha guruh to'g'ridan-to'g'ri chiqadi
  const qParam = Number(new URLSearchParams(location.search).get('q'));
  if (qParam) showGroup(qParam);

  let db = null, roomRef = null, code = null;
  try { db = BELL.init(); }
  catch (e) { $('msg').textContent = e.message; }

  // ---------- Bir vaqtli o'yin (o'quvchi sahifasi bilan bir xil vaqt jadvali) ----------
  const Q_PER_STAGE = 20, GAP_MS = 1500, BREAK_MS = 12000, LEAD_MS = 5000;
  let serverOffset = 0;
  const serverNow = () => Date.now() + serverOffset;
  if (db) db.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
  let roomLessons = [], roomLevel = 1, roomTime = 5;
  let s1 = 0, gameQs = null, qs3Timer = null, phaseTimer = null;
  const clean = x => JSON.parse(JSON.stringify(x));

  function timeline(now) {
    const T = roomTime * 1000, SLOT = T + GAP_MS, STAGE_LEN = Q_PER_STAGE * SLOT, PERIOD = STAGE_LEN + BREAK_MS;
    const t = now - s1;
    if (t < 0) return { phase: 'lead', left: -t };
    const stage = Math.floor(t / PERIOD) + 1;
    if (stage > 3) return { phase: 'end' };
    const w = t - (stage - 1) * PERIOD;
    if (w >= STAGE_LEN) return stage === 3 ? { phase: 'end' } : { phase: 'break', stage: stage, left: PERIOD - w };
    const idx = Math.floor(w / SLOT);
    const r = w - idx * SLOT;
    if (r < T) return { phase: 'ask', stage: stage, idx: idx };
    return { phase: 'reveal', stage: stage, idx: idx };
  }

  function phaseText() {
    if (!s1) return '';
    const st = timeline(serverNow());
    if (st.phase === 'lead') return "Boshlanishiga " + Math.ceil(st.left / 1000) + " soniya";
    if (st.phase === 'ask') return st.stage + "-bosqich · savol " + (st.idx + 1) + "/" + Q_PER_STAGE;
    if (st.phase === 'reveal') return st.stage + "-bosqich · to'g'ri javob ko'rsatilmoqda";
    if (st.phase === 'break') return st.stage + "-bosqich tugadi · reyting (" + Math.ceil(st.left / 1000) + " s)";
    return "O'yin tugadi";
  }

  function makeStage12(stage, pool, exclude) {
    const cfg = BELL.LEVELS[roomLevel];
    const field = stage === 1 ? 'uz' : 'kor';
    const prompt = stage === 1 ? 'kor' : 'uz';
    const avail = BELL.shuffle(pool.filter(w => !exclude.has(w.kor)));
    const picks = avail.slice(0, Q_PER_STAGE);
    while (picks.length < Q_PER_STAGE && pool.length) picks.push(BELL.shuffle(pool)[0]);
    return picks.map(w => {
      const cands = BELL.shuffle(pool.filter(x => x[field] !== w[field]));
      const seen = new Set([w[field]]);
      const wrong = [];
      for (const x of cands) { if (!seen.has(x[field])) { seen.add(x[field]); wrong.push(x[field]); } if (wrong.length === cfg.opts - 1) break; }
      return { type: 'choice', stage: stage, prompt: w[prompt], options: BELL.shuffle([w[field], ...wrong]), answer: w[field], item: w };
    });
  }

  // 3-bosqich: avval 1–2 bosqichda xato qilingan so'zlar, keyin qolganlari
  function makeStage3(pool, wrongKors) {
    const cfg = BELL.LEVELS[roomLevel];
    const wrongs = pool.filter(w => wrongKors.has(w.kor));
    const rest = BELL.shuffle(pool.filter(w => !wrongKors.has(w.kor)));
    const list = BELL.shuffle(wrongs).concat(rest).slice(0, Q_PER_STAGE);
    return list.map(w => {
      if (cfg.typed) return { type: 'typed', stage: 3, prompt: w.uz, answer: w.kor, item: w };
      const syl = BELL.syllables(w.kor);
      const extra = [];
      BELL.shuffle(BELL.allWords().map(x => x.kor)).forEach(k => BELL.syllables(k).forEach(s => { if (!syl.includes(s) && !extra.includes(s)) extra.push(s); }));
      const tiles = BELL.shuffle([...syl, ...extra.slice(0, cfg.tiles - syl.length)]);
      return { type: 'tiles', stage: 3, prompt: w.uz, answer: w.kor, syl: syl, tiles: tiles, item: w };
    });
  }

  function scheduleStage3() {
    const SLOT = roomTime * 1000 + GAP_MS, STAGE_LEN = Q_PER_STAGE * SLOT, PERIOD = STAGE_LEN + BREAK_MS;
    clearTimeout(qs3Timer);
    qs3Timer = setTimeout(buildStage3, Math.max(0, s1 + PERIOD + STAGE_LEN - serverNow() + 300));
  }

  // 2-bosqich tugagach, javoblar asosida 3-bosqich savollari tuziladi
  async function buildStage3() {
    if (!roomRef || !gameQs) return;
    const snap = await roomRef.child('answers').once('value');
    const ans = snap.val() || {};
    const wrongKors = new Set();
    [1, 2].forEach(stage => gameQs[stage].forEach((q, idx) => {
      const a = ans['s' + stage + '_' + idx] || {};
      if (Object.values(a).some(v => v === false)) wrongKors.add(q.item.kor);
    }));
    await roomRef.child('game/qs3').set(clean(makeStage3(gameQs.pool, wrongKors)));
  }

  $('startBtn').onclick = () => {
    if (!roomRef || s1) return;
    const pool = BELL.pool(roomLessons);
    if (!pool.length) { $('roomMsg').textContent = "Bo'limlar topilmadi"; return; }
    const qs1 = makeStage12(1, pool, new Set());
    const qs2 = makeStage12(2, pool, new Set(qs1.map(q => q.item.kor)));
    gameQs = { 1: qs1, 2: qs2, pool: pool };
    s1 = serverNow() + LEAD_MS;
    roomRef.update({ status: 'started', game: clean({ s1: s1, qs1: qs1, qs2: qs2 }) });
    scheduleStage3();
    $('startBtn').disabled = true;
    $('roomMsg').textContent = "O'yin boshlandi. Hamma bir vaqtda boshlaydi.";
    clearInterval(phaseTimer);
    phaseTimer = setInterval(() => { $('phase').textContent = phaseText(); }, 300);
  };

  $('createBtn').onclick = async () => {
    if (!db) return;
    const lessons = [...document.querySelectorAll('#lessons input:checked')].map(i => i.value);
    if (!lessons.length) { $('msg').textContent = "Kamida bitta bo'lim tanlang"; return; }
    $('msg').textContent = '';

    // Bo'sh xona kodini topish
    let c = BELL.randomCode();
    for (let i = 0; i < 10; i++) {
      const snap = await db.ref('rooms/' + c).once('value');
      if (!snap.exists()) break;
      c = BELL.randomCode();
    }
    code = c;
    roomRef = db.ref('rooms/' + code);
    roomLessons = lessons;
    roomTime = Number($('time').value);
    roomLevel = Number($('level').value);
    await roomRef.set({
      status: 'lobby',
      lessons: lessons,
      time: roomTime,
      level: roomLevel,
      createdAt: Date.now()
    });
    showRoom();
  };

  function showRoom() {
    $('setup').style.display = 'none';
    $('roomCard').style.display = 'block';
    $('code').textContent = code;
    const url = new URL('join.html?room=' + code, location.href).href;
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: url, width: 200, height: 200 });

    roomRef.child('players').on('value', snap => {
      const list = [];
      snap.forEach(ch => list.push(ch.val()));
      list.sort((a, b) => (b.score || 0) - (a.score || 0));
      $('count').textContent = list.length;
      $('players').innerHTML = list.map(p =>
        `<li><span>${p.avatar} ${escapeHtml(p.name)}</span><strong>${p.score || 0}</strong></li>`).join('');
    });
  }

  $('endBtn').onclick = () => {
    if (roomRef) roomRef.update({ status: 'ended' });
    $('roomMsg').textContent = "O'yin yakunlandi.";
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
</script>
</body>
</html>
