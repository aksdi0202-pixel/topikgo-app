<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essential Korean Words 2000 · TopikGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px 32px;
  }
  header { width: 100%; max-width: 420px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .back {
    text-decoration: none; color: #005ae6; font-size: 26px; font-weight: 700; line-height: 1;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #e6f8ff;
    border: 2px solid #96ebff;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 800; color: #142a5a; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; width: 100%; max-width: 420px; }
  .levels { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  /* LED-style level cards: Uzbek name on top, Korean below; colour set per level */
  .lvl {
    position: relative; width: 260px; height: 124px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; background: linear-gradient(180deg, #fff, var(--tint));
    border: 2px solid var(--acc);
    box-shadow: 0 0 0 1px var(--acc), 0 0 16px var(--glow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .lvl-name { font-size: 20px; font-weight: 800; color: var(--dark); }
  .lvl-kor { font-size: 28px; font-weight: 800; color: var(--acc); }
  .lvl:active { transform: translateY(4px); }
  .lvl-1 { --acc:#22a050; --dark:#0e5a2c; --tint:#eaf9ef; --glow:rgba(40,200,100,.45); }
  .lvl-2 { --acc:#2f6fd6; --dark:#143f86; --tint:#eaf2fd; --glow:rgba(47,111,214,.45); }
  .lvl-3 { --acc:#534AB7; --dark:#2d2870; --tint:#efeefc; --glow:rgba(83,74,183,.45); }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: url('bg-logo.png') no-repeat center 55% / min(88%, 520px) auto;
    opacity: .22;
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html?v=2" aria-label="Orqaga">‹</a>
    <h1>Essential Korean Words 2000</h1>
  </header>
  <p class="sub">Darajani tanlang</p>
  <nav class="levels">
    <a class="lvl lvl-1" href="boshlangich.html?v=1"><span class="lvl-name">Boshlang'ich</span><span class="lvl-kor">초급</span></a>
    <a class="lvl lvl-2" href="orta.html?v=1"><span class="lvl-name">O'rta</span><span class="lvl-kor">중급</span></a>
    <a class="lvl lvl-3" href="#"><span class="lvl-name">Yuqori</span><span class="lvl-kor">고급</span></a>
  </nav>
  <script>
    try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
  </script>
</body>
</html>
