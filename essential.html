<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px 32px;
  }
  header { width: 100%; max-width: 420px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .back {
    text-decoration: none; color: #005ae6; font-size: 26px; font-weight: 700; line-height: 1;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #e6f8ff;
    border: 2px solid #96ebff;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 800; color: #142a5a; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; width: 100%; max-width: 420px; }
  .levels { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .lvl {
    position: relative; width: 260px; height: 124px; border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; font-weight: 800; overflow: hidden;
    border: 2px solid rgba(150,235,255,.9); transition: transform .12s ease, box-shadow .12s ease;
  }
  .lvl::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 6px; height: 46%;
    border-radius: 22px; background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.05));
    pointer-events: none;
  }
  .lvl-name { position: relative; font-size: 20px; }
  .lvl-kor { position: relative; font-size: 30px; }
  .lvl:active { transform: translateY(6px); }
  .lvl-1 {
    background: linear-gradient(160deg, #f2b705, #ffd21f); color: #2b1d00;
    box-shadow: 0 10px 0 #8a6200, 0 0 18px rgba(255,200,0,.55); border-color: rgba(255,240,170,.95);
  }
  .lvl-2 {
    background: linear-gradient(160deg, #22a050, #78dc8c); color: #fff;
    box-shadow: 0 10px 0 #0e5a2c, 0 0 18px rgba(40,200,100,.5);
  }
  .lvl-3 {
    background: linear-gradient(160deg, #141e5a, #3c50aa); color: #fff;
    box-shadow: 0 10px 0 #070d2e, 0 0 18px rgba(60,80,170,.55);
  }
</style>
