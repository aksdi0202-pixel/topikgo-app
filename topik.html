<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쏙쏙 TOPIK · TopikGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; --line:#9FE1CB; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #CFF2E3; color: var(--text); display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px 32px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back {
    text-decoration: none; color: var(--text); font-size: 24px; line-height: 1;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff;
    border: 1px solid #dde3ec;
  }
  .label { font-size: 13px; color: var(--muted); letter-spacing: .5px; margin: 0; }
  .title { font-size: 22px; font-weight: 700; margin: 2px 0 0; }
  .title small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .card {
    display: flex; align-items: center; justify-content: space-between;
    text-decoration: none; color: var(--ink); border-radius: 18px; padding: 18px 16px; min-height: 88px;
    background: var(--bg-c); border: 2px solid #fff;
    box-shadow: 0 0 6px #fff, 0 0 16px rgba(255,255,255,.9), 0 0 30px rgba(255,255,255,.6);
    transition: transform .12s ease;
  }
  .card-name { font-size: 20px; font-weight: 700; }
  .card-arrow {
    width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 40px;
  }
  .card:active { transform: translateY(3px); }
  .card-yellow { --bg-c: #EEEDFE; --ink: #26215C; }
  .card-green { --bg-c: #EAF3DE; --ink: #173404; }
  .card-navy { --bg-c: #FBEAF0; --ink: #4B1528; }
  .card.disabled { opacity: .55; pointer-events: none; }
  .count { text-align: left; color: var(--muted); font-size: 14px; margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="index.html?v=2" aria-label="Orqaga">‹</a>
    </div>
    <p class="label">쏙쏙 TOPIK</p>
    <h1 class="title">Lug'atlar <small>어휘</small></h1>
    <nav class="list">
      <a class="card card-yellow" href="beginner.html?v=1"><span class="card-name">TOPIK 1 va 2</span><span class="card-arrow">›</span></a>
      <a class="card card-green" href="orta.html?v=1"><span class="card-name">TOPIK 3 va 4</span><span class="card-arrow">›</span></a>
      <a class="card card-navy disabled" href="#"><span class="card-name">TOPIK 5 va 6</span><span class="card-arrow">›</span></a>
    </nav>
    <p class="count">2 / 3 ochiq</p>
  </div>
  <script>
    try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}

    let audioCtx = null;
    function playClick() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const t0 = audioCtx.currentTime;
        osc.frequency.setValueAtTime(700, t0);
        osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.08);
        gain.gain.setValueAtTime(0.5, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.09);
      } catch (e) {}
    }

    document.querySelectorAll('a.card:not(.disabled)').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        playClick();
        const href = a.getAttribute('href');
        setTimeout(() => { window.location.href = href; }, 150);
      });
    });
  </script>
</body>
</html>
