<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쏙쏙 TOPIK · TopikGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; --line:#9FE1CB; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px 32px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back {
    text-decoration: none; color: var(--text); font-size: 24px; line-height: 1;
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff;
    border: 1px solid #dde3ec;
  }
  .label { font-size: 13px; color: var(--muted); letter-spacing: .5px; margin: 0; }
  .title { font-size: 22px; font-weight: 700; margin: 2px 0 0; }
  .title small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .card {
    position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; color: #fff; border-radius: 24px; padding: 18px 16px 22px; min-height: 130px;
    background: var(--bg-c); border: 2px solid rgba(150,235,255,.9);
    box-shadow: 0 10px 0 var(--shade), 0 0 18px var(--glow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 6px; height: 44%;
    border-radius: 18px; background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.05)); pointer-events: none;
  }
  .card-name {
    position: relative; font-size: 16px; font-weight: 700; padding: 4px 14px;
    background: rgba(255,255,255,.2); border-radius: 14px;
  }
  .card-kor { position: relative; font-size: 30px; font-weight: 800; margin-top: 8px; }
  .card:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--shade); }
  .card-yellow { --bg-c: linear-gradient(90deg,#f5b700,#ffd21f); --shade: #8a6200; --glow: rgba(255,200,0,.55); color: #2b1d00; border-color: rgba(255,240,170,.95); }
  .card-green { --bg-c: linear-gradient(90deg,#2ea55a,#5fcf86); --shade: #0e5a30; --glow: rgba(60,200,120,.5); }
  .card-navy { --bg-c: linear-gradient(90deg,#1c2566,#3a4aa8); --shade: #0a0f33; --glow: rgba(60,90,220,.5); }
  .card.disabled { opacity: .55; pointer-events: none; }
  .count { text-align: left; color: var(--muted); font-size: 14px; margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="index.html" aria-label="Orqaga">‹</a>
    </div>
    <p class="label">쏙쏙 TOPIK</p>
    <h1 class="title">Lug'atlar <small>어휘</small></h1>
    <nav class="list">
      <a class="card card-yellow" href="beginner.html?v=1"><span class="card-name">Boshlang'ich</span><span class="card-kor">초급</span></a>
      <a class="card card-green" href="orta.html?v=1"><span class="card-name">O'rta</span><span class="card-kor">중급</span></a>
      <a class="card card-navy disabled" href="#"><span class="card-name">Yuqori</span><span class="card-kor">고급</span></a>
    </nav>
    <p class="count">2 / 3 ochiq</p>
  </div>
  <script>
    try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
  </script>
</body>
</html>
