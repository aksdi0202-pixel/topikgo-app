<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hozir online · TopikGo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f7fb; color: #1d2433; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .label { font-size: 16px; color: #6b7385; margin: 0; }
  .count { font-size: 64px; font-weight: 800; margin: 0; }
  .note { font-size: 13px; color: #6b7385; margin: 0; }
</style>
</head>
<body>
  <p class="label">Hozir saytda</p>
  <p class="count" id="count">—</p>
  <p class="note" id="note">Ulanilmoqda...</p>
  <script>
    // Firebase loyihasidagi kalitlar bilan almashtiring (index.html bilan bir xil)
    const PRESENCE_CONFIG = {
      apiKey: "AIzaSyBuaSb9rso27Ul3uEIzZR0rp8VUswI8CtI",
      databaseURL: "https://bellashuv-a7b16-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bellashuv-a7b16"
    };
    const STALE_MS = 90 * 1000;
    try {
      if (PRESENCE_CONFIG.apiKey === "KODINGIZ") {
        document.getElementById('note').textContent = "Firebase sozlamasi hali kiritilmagan";
      } else {
        firebase.initializeApp(PRESENCE_CONFIG);
        firebase.database().ref('online').on('value', snap => {
          const now = Date.now();
          let n = 0;
          snap.forEach(child => { if (now - child.val() < STALE_MS) n++; });
          document.getElementById('count').textContent = n;
          document.getElementById('note').textContent = "Yangilanmoqda: " + new Date().toLocaleTimeString();
        });
      }
    } catch (e) {
      document.getElementById('note').textContent = "Xatolik: " + e.message;
    }
  </script>
</body>
</html>
