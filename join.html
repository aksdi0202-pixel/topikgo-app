<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellashuv · o'yinchi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="hanja-data.js?v=16"></script>
<script src="bellashuv-core.js?v=1"></script>
<style>
  :root { --bg:#f4f7fb; --text:#1d2433; --muted:#6b7385; --accent:#534AB7; --ok:#1D9E75; --bad:#b93a2b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:16px; min-height:100vh; }
  .screen { display:none; max-width:460px; margin:0 auto; }
  .screen.on { display:block; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 4px 14px rgba(31,45,80,.08); }
  .avatars { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .avatars button { font-size:30px; padding:10px 0; border-radius:14px; border:2px solid #dde3ec; background:#fff; cursor:pointer; }
  .avatars button.sel { border-color:var(--accent); background:#EEEDFE; }
  .avatars button:disabled { opacity:.35; cursor:not-allowed; }
  input[type=text] { width:100%; font-size:18px; padding:12px; border-radius:12px; border:1px solid #c9d3e0; }
  button.primary { width:100%; font-size:17px; padding:13px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.5; }
  .meta { display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-bottom:8px; }
  .bar { height:8px; border-radius:6px; background:#e3e8f1; overflow:hidden; margin-bottom:12px; }
  .bar > div { height:100%; width:100%; background:var(--accent); }
  .prompt { font-size:30px; font-weight:800; text-align:center; margin:14px 0 18px; min-height:44px; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choices button, .tiles button { font-size:17px; padding:14px 8px; border-radius:14px; border:2px solid #dde3ec; background:#fff; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .built { min-height:40px; text-align:center; font-size:24px; font-weight:700; margin:8px 0; letter-spacing:4px; }
  .feedback { min-height:24px; text-align:center; font-weight:700; margin-top:10px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .err { color:var(--bad); font-size:14px; min-height:18px; margin-top:8px; }
  .big { font-size:44px; font-weight:800; text-align:center; margin:8px 0; }
  .center { text-align:center; }
  .rank { font-size:16px; color:var(--muted); margin:4px 0 10px; }
  .top { list-style:none; padding:0; margin:0; text-align:left; }
  .top li { display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #eef1f6; font-size:16px; }
  .countdown { font-size:14px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>

  <!-- 1. Qo'shilish -->
  <section class="screen on" id="sJoin">
    <div class="card">
      <p style="margin:0 0 10px;font-weight:700;font-size:18px;">Hayvonni tanlang</p>
      <div class="avatars" id="avatars"></div>
      <p style="margin:16px 0 6px;font-weight:600;">Ismingiz</p>
      <input type="text" id="name" maxlength="12" placeholder="Masalan: Ali">
      <button class="primary" id="joinBtn" type="button">Qo'shilish</button>
      <p class="err" id="joinErr"></p>
    </div>
  </section>

  <!-- 2. Kutish -->
  <section class="screen" id="sWait">
    <div class="card center">
      <div class="big" id="myAvatar"></div>
      <p style="font-size:18px;font-weight:700;margin:0;" id="myName"></p>
      <p style="color:var(--muted);" id="waitMsg">O'qituvchi o'yinni boshlashini kuting...</p>
    </div>
  </section>

  <!-- 3. O'yin -->
  <section class="screen" id="sPlay">
    <div class="meta"><span id="progress"></span><span id="scoreTxt"></span></div>
    <div class="bar"><div id="timerBar"></div></div>
    <div class="prompt" id="prompt"></div>
    <div id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- 4. Bosqich tugadi: reyting -->
  <section class="screen" id="sStage">
    <div class="card center">
      <p id="stageTitle" style="font-size:20px;font-weight:700;margin:0 0 8px;"></p>
      <div class="big" id="stageScore"></div>
      <p class="rank" id="stageRank"></p>
      <ul class="top" id="stageTop"></ul>
      <p class="countdown" id="breakLeft"></p>
    </div>
  </section>

  <!-- 5. Yakun -->
  <section class="screen" id="sEnd">
    <div class="card center">
      <p style="font-size:20px;font-weight:700;margin:0 0 8px;">O'yin tugadi</p>
      <div class="big" id="finalScore"></div>
      <p class="rank" id="finalRank"></p>
      <ul class="top" id="finalTop"></ul>
      <p style="color:var(--muted);">Ballaringiz saqlandi.</p>
    </div>
  </section>

<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const CODE = params.get('room');
  const MAX_SCORE = 100;
  const Q_PER_STAGE = 20;
  const GAP_MS = 1500;     // javobdan keyin to'g'ri javob ko'rsatiladigan vaqt
  const BREAK_MS = 12000;  // bosqich oralig'idagi reyting vaqti

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  }
  function err(msg) { $('joinErr').textContent = msg; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Server vaqti (hamma o'yinchida bir xil vaqt hisobi uchun)
  let serverOffset = 0;
  const serverNow = () => Date.now() + serverOffset;

  // Yagona o'yinchi ID'si (shu xona uchun)
  let myId = null;
  if (CODE) {
    myId = sessionStorage.getItem('bell_' + CODE);
    if (!myId) {
      myId = Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem('bell_' + CODE, myId);
    }
  }

  let db = null, roomRef = null, room = null, picked = null;
  let game = { started: false, finished: false, score: 0, qKey: null, bKey: null, answered: {}, handled: {}, ticker: null };

  if (!CODE) {
    show('sJoin'); err("Xona kodi yo'q. QR kodni qayta skanerlang.");
  } else {
    try { db = BELL.init(); }
    catch (e) { show('sJoin'); err(e.message); }
  }

  if (db && CODE) {
    db.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
    roomRef = db.ref('rooms/' + CODE);
    roomRef.on('value', snap => {
      room = snap.val();
      if (!room) { show('sJoin'); err("Bunday xona topilmadi"); return; }
      renderAvatars();
      const me = room.players && room.players[myId];
      if (room.status === 'ended') {
        if (game.started) { finishGame(); return; }
        show('sJoin'); err("O'yin yakunlangan"); return;
      }
      if (me && room.status === 'started' && room.game && !game.started) { startGame(); return; }
      if (me && !game.started) { show('sWait'); $('myAvatar').textContent = me.avatar; $('myName').textContent = me.name; }
    });
  }

  function renderAvatars() {
    const taken = {};
    Object.entries((room && room.players) || {}).forEach(([id, p]) => { if (id !== myId) taken[p.avatar] = true; });
    $('avatars').innerHTML = BELL.AVATARS.map(a =>
      `<button type="button" data-a="${a}" class="${picked === a ? 'sel' : ''}" ${taken[a] ? 'disabled' : ''}>${a}</button>`).join('');
    $('avatars').querySelectorAll('button').forEach(b => b.onclick = () => { picked = b.dataset.a; renderAvatars(); });
  }
  renderAvatars();

  $('joinBtn').onclick = () => {
    if (!roomRef) return;
    const name = $('name').value.trim();
    if (!name) return err("Ismingizni kiriting");
    if (!picked) return err("Hayvonni tanlang");
    err('');
    roomRef.child('players/' + myId).set({ name: name, avatar: picked, score: 0 });
    roomRef.child('players/' + myId).onDisconnect().remove();
  };

  // ---------- Vaqt jadvali (hamma uchun bir xil) ----------
  // Bosqich: 20 savol, har savol T soniya javob + GAP_MS to'g'ri javob.
  // Bosqichlar orasida BREAK_MS reyting. 3-bosqich tugagach final.
  function timeline(now) {
    const T = (room.time || 5) * 1000;
    const SLOT = T + GAP_MS;
    const STAGE_LEN = Q_PER_STAGE * SLOT;
    const PERIOD = STAGE_LEN + BREAK_MS;
    const t = now - room.game.s1;
    if (t < 0) return { phase: 'lead', left: -t };
    const stage = Math.floor(t / PERIOD) + 1;
    if (stage > 3) return { phase: 'end' };
    const w = t - (stage - 1) * PERIOD;
    if (w >= STAGE_LEN) {
      if (stage === 3) return { phase: 'end' };
      return { phase: 'break', stage: stage, left: PERIOD - w };
    }
    const idx = Math.floor(w / SLOT);
    const r = w - idx * SLOT;
    if (r < T) return { phase: 'ask', stage: stage, idx: idx, remain: T - r };
    return { phase: 'reveal', stage: stage, idx: idx };
  }

  // ---------- O'yin ----------
  function startGame() {
    game.started = true;
    game.ticker = setInterval(tick, 200);
    tick();
  }

  function tick() {
    if (!room || !room.game || game.finished) return;
    const st = timeline(serverNow());

    if (st.phase === 'lead') {
      show('sWait');
      $('waitMsg').textContent = "Boshlanishiga " + Math.ceil(st.left / 1000) + " soniya...";
      return;
    }
    if (st.phase === 'end') { finishGame(); return; }
    if (st.phase === 'break') {
      if (game.bKey !== st.stage) { game.bKey = st.stage; renderBreak(st.stage); }
      $('breakLeft').textContent = "Keyingi bosqich: " + Math.ceil(st.left / 1000) + " soniya";
      return;
    }

    const qKey = st.stage + '-' + st.idx;
    const qs = room.game['qs' + st.stage];
    const q = qs && qs[st.idx];
    if (!q) {
      // 3-bosqich savollari hali o'qituvchidan kelmagan
      show('sPlay');
      $('prompt').textContent = "Savollar tayyorlanmoqda...";
      $('answerArea').innerHTML = '';
      game.qKey = null;
      return;
    }
    if (game.qKey !== qKey) { game.qKey = qKey; renderQuestion(q, st.stage, st.idx); }

    const bar = $('timerBar');
    if (st.phase === 'ask') {
      bar.style.transition = 'width .2s linear';
      bar.style.width = (st.remain / ((room.time || 5) * 1000) * 100) + '%';
    } else {
      bar.style.transition = 'none';
      bar.style.width = '0%';
      if (!game.handled[qKey]) {
        game.handled[qKey] = true;
        if (!game.answered[qKey]) {
          game.answered[qKey] = true;
          recordAnswer(st.stage, st.idx, false);
          disableArea();
          $('feedback').className = 'feedback bad';
          $('feedback').textContent = "Vaqt tugadi. To'g'ri javob: " + q.answer;
        }
      }
    }
    $('scoreTxt').textContent = 'Ball: ' + game.score;
  }

  function renderQuestion(q, stage, idx) {
    show('sPlay');
    $('progress').textContent = stage + '-bosqich · ' + (idx + 1) + '/' + Q_PER_STAGE;
    $('scoreTxt').textContent = 'Ball: ' + game.score;
    $('prompt').textContent = q.prompt;
    $('feedback').className = 'feedback';
    $('feedback').textContent = '';
    $('timerBar').style.transition = 'none';
    $('timerBar').style.width = '100%';
    const area = $('answerArea');
    area.innerHTML = '';

    if (q.type === 'choice') {
      area.innerHTML = '<div class="choices">' + q.options.map((o, i) =>
        `<button type="button" data-i="${i}">${escapeHtml(o)}</button>`).join('') + '</div>';
      area.querySelectorAll('button').forEach(b => b.onclick = () => {
        answer(q.options[Number(b.dataset.i)] === q.answer, q.answer);
      });
    } else if (q.type === 'tiles') {
      let chosen = [];
      area.innerHTML = '<div class="built" id="built"></div><div class="tiles">' + q.tiles.map((t, i) =>
        `<button type="button" data-i="${i}">${escapeHtml(t)}</button>`).join('') + '</div>' +
        '<button class="primary" type="button" id="clearBtn" style="background:#fff;color:var(--accent);border:1px solid #c9d3e0;">Tozalash</button>';
      area.querySelectorAll('.tiles button').forEach(b => b.onclick = () => {
        if (b.disabled) return;
        chosen.push(q.tiles[Number(b.dataset.i)]);
        b.disabled = true;
        $('built').textContent = chosen.join('');
        if (chosen.length === q.syl.length) answer(chosen.join('') === q.answer, q.answer);
      });
      $('clearBtn').onclick = () => {
        chosen = [];
        area.querySelectorAll('.tiles button').forEach(b => b.disabled = false);
        $('built').textContent = '';
      };
    } else {
      area.innerHTML = '<input type="text" id="typed" autocomplete="off" placeholder="Koreyscha yozing"><button class="primary" type="button" id="submitBtn">Yuborish</button>';
      const submit = () => {
        const v = $('typed').value.replace(/\s/g, '');
        if (!v) return;
        answer(v === q.answer, q.answer);
      };
      $('submitBtn').onclick = submit;
      $('typed').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      $('typed').focus();
    }
  }

  function disableArea() {
    document.querySelectorAll('#answerArea button, #answerArea input').forEach(e => e.disabled = true);
  }

  // Javob: birinchi bosgan ko'proq ball oladi (vaqt server vaqti bo'yicha hisoblanadi)
  function answer(isCorrect, correctStr) {
    const st = timeline(serverNow());
    const qKey = st.stage + '-' + st.idx;
    if (st.phase !== 'ask' || qKey !== game.qKey || game.answered[qKey]) return;
    game.answered[qKey] = true;
    disableArea();

    let pts = 0;
    if (isCorrect) pts = Math.round(MAX_SCORE * 0.5 + MAX_SCORE * 0.5 * (st.remain / ((room.time || 5) * 1000)));
    game.score += pts;
    if (roomRef) roomRef.child('players/' + myId + '/score').set(game.score);
    recordAnswer(st.stage, st.idx, !!isCorrect);

    const fb = $('feedback');
    if (isCorrect) { fb.className = 'feedback ok'; fb.textContent = '+' + pts; }
    else { fb.className = 'feedback bad'; fb.textContent = "Noto'g'ri. To'g'ri javob: " + correctStr; }
    $('scoreTxt').textContent = 'Ball: ' + game.score;
  }

  // Har bir savol bo'yicha javob (o'qituvchi 3-bosqich savollarini shu asosda tuzadi)
  function recordAnswer(stage, idx, ok) {
    if (roomRef) roomRef.child('answers/s' + stage + '_' + idx + '/' + myId).set(ok);
  }

  // ---------- Reyting ----------
  function ranking() {
    const list = Object.entries((room && room.players) || {}).map(([id, p]) => ({
      id: id, name: p.name || '', avatar: p.avatar || '', score: p.score || 0 }));
    list.sort((a, b) => b.score - a.score);
    return list;
  }
  function rankInfo() {
    const list = ranking();
    const i = list.findIndex(p => p.id === myId);
    return { rank: i + 1, total: list.length, list: list };
  }
  function rankText(info) {
    return info.rank ? "Siz " + info.rank + "-o'rindasiz (jami " + info.total + ")" : '';
  }
  function topHtml(list) {
    return list.slice(0, 5).map((p, i) =>
      `<li><span>${i + 1}. ${p.avatar} ${escapeHtml(p.name)}</span><strong>${p.score}</strong></li>`).join('');
  }

  function renderBreak(stage) {
    show('sStage');
    const info = rankInfo();
    $('stageTitle').textContent = stage + '-bosqich yakunlandi';
    $('stageScore').textContent = game.score;
    $('stageRank').textContent = rankText(info);
    $('stageTop').innerHTML = topHtml(info.list);
  }

  function finishGame() {
    if (game.finished) return;
    game.finished = true;
    clearInterval(game.ticker);
    show('sEnd');
    const info = rankInfo();
    $('finalScore').textContent = game.score;
    $('finalRank').textContent = rankText(info);
    $('finalTop').innerHTML = topHtml(info.list);
  }
</script>
</body>
</html>
