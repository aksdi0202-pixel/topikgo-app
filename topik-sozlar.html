<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topik so'zlar</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --acc:#1f4e78; --ok:#2e7d32; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--acc); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  main { max-width:560px; margin:0 auto; padding:14px; }
  .hidden { display:none !important; }
  .sections { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sec { background:linear-gradient(180deg,#ffffff,#eaf3ff); border:1.5px solid #96ebff; border-radius:22px; padding:16px 14px; text-align:left; cursor:pointer; box-shadow:0 6px 0 #c9dcf5, 0 8px 18px rgba(0,120,255,.12); transition:transform .12s ease; }
  .sec:active { transform:translateY(4px); box-shadow:0 2px 0 #c9dcf5; }
  .sec b { display:block; font-size:16px; font-weight:800; margin-bottom:6px; color:#142a5a; }
  .sec span { color:#005ae6; font-size:13px; font-weight:600; }
  .twrap { position:relative; display:inline-block; }
  .tmenu { position:absolute; top:calc(100% + 6px); left:0; z-index:5; background:#fff; border:1px solid #cbd5e1; border-radius:14px; padding:6px; display:flex; flex-direction:column; gap:4px; box-shadow:0 8px 20px rgba(0,0,0,.12); min-width:120px; }
  .tmenu .btn { text-align:left; border-radius:10px; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; }
  .btn { border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .btn.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .btn.ghost { border:0; background:transparent; color:var(--acc); padding:7px 4px; }
  .progress { font-size:13px; color:var(--muted); margin-left:auto; }
  .stage { perspective:1000px; min-height:260px; }
  .flip { position:relative; width:100%; height:260px; transform-style:preserve-3d; transition:transform .45s; cursor:pointer; }
  .flip.back { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; background:var(--card); border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,.1); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
  .face.b { transform:rotateY(180deg); }
  .word { font-size:30px; font-weight:600; word-break:keep-all; }
  .meaning { font-size:20px; }
  .tag { position:absolute; top:12px; left:14px; font-size:12px; color:var(--muted); }
  .hint { position:absolute; bottom:10px; font-size:12px; color:var(--muted); }
  .note { margin-top:10px; font-size:13px; color:var(--muted); text-align:center; min-height:18px; }
  .nav { display:flex; gap:10px; margin-top:14px; }
  .nav .btn { flex:1; padding:12px; font-size:15px; }
  .done { text-align:center; padding:40px 10px; }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .top h2 { font-size:16px; margin:0; flex:1; }
</style>
</head>
<body>
<header><h1>Topik so'zlar</h1></header>
<main>

  <!-- Bo'limlar -->
  <section id="home">
    <div class="bar"><input id="q" class="btn" style="flex:1;min-width:0" placeholder="Bo'lim qidirish..."></div>
    <div id="secs" class="sections"></div>
  </section>

  <!-- Kartochkalar -->
  <section id="deck" class="hidden">
    <div class="top">
      <button class="btn ghost" id="back">← Bo'limlar</button>
      <h2 id="title"></h2>
    </div>
    <div class="bar">
      <button class="btn on" id="dirKU">Koreys → O'zbek</button>
      <button class="btn" id="dirUK">O'zbek → Koreys</button>
      <button class="btn" id="dirMix">Aralash</button>
    </div>
    <div class="bar">
      <button class="btn on" data-pos="">Hammasi</button>
      <button class="btn" data-pos="Ot">Ot</button>
      <button class="btn" data-pos="Fe'l">Fe'l</button>
      <button class="btn" data-pos="Sifat">Sifat</button>
      <button class="btn" data-pos="Ibora">Ibora</button>
    </div>
    <div class="bar"><span class="progress" id="prog" style="margin-left:0"></span></div>
    <div class="bar tools">
      <div class="twrap">
        <button class="btn" id="timer">⏱ Timer</button>
        <div id="tmenu" class="tmenu hidden">
          <button class="btn" data-sec="0">O'chiq</button>
          <button class="btn" data-sec="3">3 s</button>
          <button class="btn" data-sec="5">5 s</button>
          <button class="btn" data-sec="7">7 s</button>
          <button class="btn" data-sec="10">10 s</button>
        </div>
      <button class="btn" id="shuffle">Aralashtirish</button>
      </div>
    </div>
    <div class="stage"><div id="card" class="flip"></div></div>
    <div class="note" id="note"></div>
    <div class="nav">
      <button class="btn" id="prev">← Oldingi</button>
      <button class="btn" id="next">Keyingi →</button>
    </div>
  </section>
</main>

const POS_LABEL = { 'Ot':'Ot', "Fe'l":"Fe'l", 'Sifat':'Sifat', 'Ibora':'Ibora', 'Ravish':'Ravish' };
let sections = [];           // [{name, items}]
let cur = null;              // current section
let list = [];               // filtered list (indices)
let idx = 0;
let dir = 'ku';              // ku | uk | mix
let posFilter = '';
let flipped = false;
let sideOf = [];            // per-card side for mix mode

// Bo'limlarni yig'ish (tartib saqlanadi)
(function build() {
  const map = new Map();
  for (const it of DATA) {
    if (!map.has(it.bolim)) map.set(it.bolim, []);
    map.get(it.bolim).push(it);
  }
  sections = [...map.entries()].map(([name, items]) => ({ name, items }));
  renderSections(sections);
})();

function renderSections(arr) {
  const box = document.getElementById('secs');
  box.innerHTML = '';
  for (const s of arr) {
    const b = document.createElement('button');
    b.className = 'sec';
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = s.name;
    b.querySelector('span').textContent = s.items.length + ' ta so\'z';
    b.onclick = () => openSection(s);
    box.appendChild(b);
  }
}

document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  renderSections(sections.filter(s => s.name.toLowerCase().includes(q)));
});

function openSection(s) {
  cur = s;
  posFilter = '';
  // Bo'limda so'zi yo'q so'z turi tugmalari yashiriladi
  document.querySelectorAll('[data-pos]').forEach(b => {
    const v = b.dataset.pos;
    const has = !v || s.items.some(it => it.tur === v);
    b.classList.toggle('hidden', !has);
  });
  setActivePos();
  document.getElementById('title').textContent = s.name;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('deck').classList.remove('hidden');
  buildList();
  window.scrollTo(0, 0);
}

document.getElementById('back').onclick = () => {
  document.getElementById('deck').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
};

function buildList() {
  list = [];
  cur.items.forEach((it, i) => { if (!posFilter || it.tur === posFilter) list.push(i); });
  idx = 0;
  sideOf = list.map(() => Math.random() < 0.5 ? 'ku' : 'uk');
  flipped = false;
  render();
}

function sideFor(i) {
  if (dir === 'mix') return sideOf[i];
  return dir;
}

function render() {
  const card = document.getElementById('card');
  const prog = document.getElementById('prog');
  const note = document.getElementById('note');
  if (!list.length) {
    card.className = 'flip';
    card.innerHTML = '<div class="face"><div class="done">Bu filtrda so\'z yo\'q.</div></div>';
    prog.textContent = '0 / 0';
    note.textContent = '';
    return;
  }
  const it = cur.items[list[idx]];
  const s = sideFor(idx);
  // ku: old = koreyscha, orqa = o'zbekcha
  const front = s === 'ku' ? it.kor : it.uz;
  const back  = s === 'ku' ? it.uz : it.kor;
  const frontCls = s === 'ku' ? 'word' : 'meaning';
  const backCls  = s === 'ku' ? 'meaning' : 'word';
  card.className = 'flip' + (flipped ? ' back' : '');
  card.innerHTML =
    '<div class="face"><span class="tag">' + (it.tur || '') + '</span>' +
    '<div class="' + frontCls + '"></div><span class="hint">bosing — javob</span></div>' +
    '<div class="face b"><span class="tag">' + (it.tur || '') + '</span>' +
    '<div class="' + backCls + '"></div>' +
    (it.izoh ? '<span class="hint">' + '</span>' : '') + '</div>';
  card.querySelector('.face:not(.b) .' + frontCls).textContent = front;
  card.querySelector('.face.b .' + backCls).textContent = back;
  if (it.izoh) card.querySelector('.face.b .hint').textContent = it.izoh;
  prog.textContent = (idx + 1) + ' / ' + list.length;
  note.textContent = '';
}

document.getElementById('card').onclick = () => {
  if (!list.length) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('back', flipped);
};

function go(d, manual = true) {
  if (!list.length) return;
  idx = (idx + d + list.length) % list.length;
  flipped = false;
  render();
  if (manual && autoSec) runAuto();
}
document.getElementById('next').onclick = () => go(1);
document.getElementById('prev').onclick = () => go(-1);

document.addEventListener('keydown', e => {
  if (document.getElementById('deck').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); document.getElementById('card').click(); }
});

// Yo'nalish
function setDir(d) {
  dir = d;
  document.getElementById('dirKU').classList.toggle('on', d === 'ku');
  document.getElementById('dirUK').classList.toggle('on', d === 'uk');
  document.getElementById('dirMix').classList.toggle('on', d === 'mix');
  flipped = false;
  render();
}
document.getElementById('dirKU').onclick = () => setDir('ku');
document.getElementById('dirUK').onclick = () => setDir('uk');
document.getElementById('dirMix').onclick = () => setDir('mix');

// So'z turi filtri
function setActivePos() {
  document.querySelectorAll('[data-pos]').forEach(b => b.classList.toggle('on', b.dataset.pos === posFilter));
}
document.querySelectorAll('[data-pos]').forEach(b => {
  b.onclick = () => { posFilter = b.dataset.pos; setActivePos(); buildList(); };
});

// Aralashtirish
document.getElementById('shuffle').onclick = () => {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  sideOf = list.map(() => Math.random() < 0.5 ? 'ku' : 'uk');
  idx = 0; flipped = false; render();
};

// ---- Avto-aylanish (Timer) ----
let autoSec = 0;
let autoTimers = [];
const tBtn = document.getElementById('timer');
const tMenu = document.getElementById('tmenu');
function clearAuto() { autoTimers.forEach(clearTimeout); autoTimers = []; }
function setCardBack(b) { flipped = b; document.getElementById('card').classList.toggle('back', b); }
function runAuto() {
  clearAuto();
  if (!autoSec) return;
  const t = autoSec * 1000;
  autoTimers.push(setTimeout(() => {
    setCardBack(true);                       // orqasi aylanadi
    autoTimers.push(setTimeout(() => {
      setCardBack(false);                    // joyiga qaytadi
      autoTimers.push(setTimeout(() => { go(1, false); runAuto(); }, 500)); // keyingi so'z
    }, t));
  }, t));
}
function updateTimerLabel() { tBtn.textContent = autoSec ? '⏱ ' + autoSec + ' s' : '⏱ Timer'; tBtn.classList.toggle('on', !!autoSec); }
tBtn.onclick = (e) => { e.stopPropagation(); tMenu.classList.toggle('hidden'); };
tMenu.querySelectorAll('button').forEach(b => b.onclick = (e) => {
  e.stopPropagation();
  autoSec = +b.dataset.sec;
  tMenu.classList.add('hidden');
  updateTimerLabel();
  if (autoSec) runAuto(); else clearAuto();
});
document.addEventListener('click', () => tMenu.classList.add('hidden'));
document.getElementById('back').addEventListener('click', () => { clearAuto(); autoSec = 0; updateTimerLabel(); });
</script>
</body>
</html>
