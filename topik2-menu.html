<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TOPIK II</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF6F2; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #1F1F1F; min-height: 100vh; padding-bottom: 96px; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .top-left { display: flex; align-items: center; gap: 10px; }
  .back, .refresh { width: 36px; height: 36px; border-radius: 50%; border: none; background: #F5EAE1; color: #7A4B2A; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .back { background: transparent; }
  .title { font-size: 18px; font-weight: 500; letter-spacing: 0.5px; }
  .hero { background: #F5EAE1; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .hero-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .hero-icon { width: 44px; height: 44px; border-radius: 50%; background: #FAF6F2; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #7A4B2A; flex-shrink: 0; }
  .hero-title { font-size: 17px; font-weight: 500; }
  .hero-desc { font-size: 13px; color: #5E5A57; line-height: 1.5; margin-bottom: 12px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { background: #FAF6F2; color: #7A563E; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: none; cursor: pointer; }
  .card { background: #F5EAE1; border-radius: 14px; padding: 12px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .num { width: 40px; height: 40px; border-radius: 50%; background: #7A4B2A; color: #FAF6F2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: #FAF6F2; color: #7A563E; font-size: 11px; padding: 4px 9px; border-radius: 999px; border: none; cursor: pointer; }
  .arrow { color: #7A4B2A; font-size: 18px; align-self: center; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #FFFFFF; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 0.5px solid #F2E4D9; display: flex; gap: 8px; justify-content: space-around; }
  .tab { flex: 1; max-width: 120px; border: none; background: transparent; color: #5E5A57; font-size: 13px; padding: 8px 18px; border-radius: 999px; cursor: pointer; }
  .tab.active { background: #F5EAE1; color: #6E4224; font-weight: 500; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1F1F1F; color: #FAF6F2; font-size: 13px; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-left">
      <button class="back" aria-label="Orqaga" onclick="goBack()">&#8592;</button>
      <span class="title">TOPIK II</span>
    </div>
    <button class="refresh" aria-label="Yangilash" onclick="location.reload()">&#8635;</button>
  </div>

  <div class="hero">
    <div class="hero-head">
      <span class="hero-icon" id="heroIcon">&#128214;</span>
      <span class="hero-title" id="heroTitle">O'qish &bull; 12 ta test</span>
    </div>
    <p class="hero-desc" id="heroDesc">Mashq to'plamini tanlang va o'qish bo'limini davom ettiring.</p>
    <div class="badges">
      <button class="badge" id="heroBadgeType">O'qish</button>
      <button class="badge">12 ta test</button>
      <button class="badge" onclick="toggleSort()">&#8593; Saralash</button>
    </div>
  </div>

  <div id="list"></div>
</div>

<div class="tabs">
  <button class="tab active" id="tabRead" onclick="setSection('read')">&#128214; O'qish</button>
  <button class="tab" id="tabListen" onclick="setSection('listen')">&#127911; Tinglash</button>
  <button class="tab" id="tabWrite" onclick="setSection('write')">&#9998; Yozish</button>
</div>

<div class="toast" id="toast"></div>

<script>
  var TESTS = [35, 36, 37, 41, 42, 47];
  var section = 'read';
  var asc = true;

  function render() {
    var nums = TESTS.slice().sort(function (a, b) { return asc ? a - b : b - a; });
    var html = '';
    nums.forEach(function (n) {
      html += '<div class="card" onclick="openTest(' + n + ')">' +
        '<span class="num">#' + n + '</span>' +
        '<div class="card-body">' +
          '<div class="card-title">제' + n + '회 한국어능력시험</div>' +
          '<div class="pills">' +
            '<button class="pill" onclick="event.stopPropagation(); soon()">Izoh</button>' +
            '<button class="pill" onclick="event.stopPropagation(); soon()">Tarjima</button>' +
            '<button class="pill" onclick="event.stopPropagation(); soon()">So\'zlar</button>' +
          '</div>' +
        '</div>' +
        '<span class="arrow">&#8250;</span>' +
      '</div>';
    });
    document.getElementById('list').innerHTML = html;
  }

  function setSection(s) {
    section = s;
    var read = s === 'read';
    document.getElementById('tabRead').classList.toggle('active', read);
    document.getElementById('tabListen').classList.toggle('active', !read);
    document.getElementById('heroIcon').innerHTML = read ? '&#128214;' : '&#127911;';
    document.getElementById('heroTitle').textContent = (read ? 'O\'qish' : 'Tinglash') + ' • 12 ta test';
    document.getElementById('heroDesc').textContent = read
      ? 'Mashq to\'plamini tanlang va o\'qish bo\'limini davom ettiring.'
      : 'Mashq to\'plamini tanlang va tinglash bo\'limini davom ettiring.';
    document.getElementById('heroBadgeType').textContent = read ? 'O\'qish' : 'Tinglash';
  }

  function toggleSort() { asc = !asc; render(); }

  function openTest(n) { soon(); }

  function soon() {
    var t = document.getElementById('toast');
    t.textContent = 'Bu bo\'lim hali tayyorlanmoqda';
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function goBack() {
    if (window.history.length > 1) window.history.back();
    else if (window.Telegram && Telegram.WebApp) Telegram.WebApp.close();
  }

  if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
  render();
</script>
</body>
</html>
