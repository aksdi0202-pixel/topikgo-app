<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Odatlar trekkeri · TopikGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1b1d1a; --muted:#6c706a; --line:#e6e4dd;
  --soft:#efeee8; --accent:#1f9d63; --accent-ink:#ffffff; --accent-soft:#dcf2e6;
  --danger:#d64545; --shadow:0 1px 2px rgba(20,20,10,.05),0 6px 20px rgba(20,20,10,.06);
  --h0:#ebe9e2; --h1:#bfe6cf; --h2:#86d1a8; --h3:#46b37d; --h4:#1f9d63;
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#111312; --card:#1a1d1b; --ink:#eef0ec; --muted:#9aa19b; --line:#2a2f2c;
  --soft:#232724; --accent:#34c27f; --accent-ink:#06150d; --accent-soft:#183326;
  --danger:#ff6b6b; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --h0:#252a27; --h1:#1d4a33; --h2:#237047; --h3:#2b9a60; --h4:#3fd08a;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 4px}
.top .left{display:flex;align-items:center;gap:12px;min-width:0}
.back{width:48px;height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:26px;font-weight:700;flex:none;text-decoration:none;color:var(--ink)}
.date{font-size:14px;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:22px;flex:none}
.summary{margin:16px 0 18px;background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.summary .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.summary .big{font-size:22px}
.summary small{color:var(--muted);font-weight:600;font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--soft);margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}

.note{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:14px;font-weight:600;line-height:1.4}
.note[hidden]{display:none}

/* cards */
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.head{display:flex;align-items:center;gap:10px}
.meta{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-height:52px;padding:2px;border-radius:14px;min-width:0}
.emoji{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:28px;flex:none}
.meta b{display:block;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px}
.streak{display:flex;flex-direction:column;align-items:flex-end;flex:none;padding-right:4px}
.streak b{font-size:20px;font-weight:800;line-height:1}
.streak small{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px}
.streak.on b{color:#e8772e}

.actions{display:flex;gap:10px;margin-top:12px}
.check{position:relative;flex:1;height:68px;border-radius:18px;background:var(--soft);font-size:19px;font-weight:800;
  overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s ease, background .2s}
.check:active{transform:scale(.97)}
.check .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent-soft);transition:width .3s ease}
.check span{position:relative}
.check.done{background:var(--accent);color:var(--accent-ink)}
.check.done .fill{display:none}
.minus{width:68px;height:68px;border-radius:18px;background:var(--soft);font-size:30px;font-weight:700;flex:none}
.minus:active{transform:scale(.95)}

.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px}
.cell{aspect-ratio:1;border-radius:7px;background:var(--h0);padding:0;min-height:22px}
.cell.l1{background:var(--h1)}.cell.l2{background:var(--h2)}.cell.l3{background:var(--h3)}.cell.l4{background:var(--h4)}
.cell.today{outline:2.5px solid var(--ink);outline-offset:1.5px}
.cell.before{opacity:.35}
.heatlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-top:7px}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .e{font-size:56px}
.empty b{display:block;color:var(--ink);font-size:20px;margin:10px 0 6px}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  height:62px;padding:0 28px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:18px;font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;z-index:5;white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab i{font-style:normal;font-size:26px;line-height:1}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  z-index:11;max-height:92vh;overflow:auto}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 16px;font-size:22px;font-weight:800}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.text{width:100%;height:56px;border-radius:16px;border:2px solid var(--line);background:var(--bg);padding:0 16px;font-size:18px;font-weight:600;outline:none}
.text:focus{border-color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emojis button{aspect-ratio:1;border-radius:14px;background:var(--soft);font-size:26px;border:2px solid transparent}
.emojis button.sel{border-color:var(--accent);background:var(--accent-soft)}
.custom{display:flex;gap:10px;align-items:center;margin-top:10px}
.custom .text{width:84px;text-align:center;font-size:24px;padding:0}
.custom small{color:var(--muted);font-size:13px;font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:60px;height:60px;border-radius:18px;background:var(--soft);font-size:28px;font-weight:700}
.stepper .val{flex:1;text-align:center;font-size:28px;font-weight:800}
.stepper .val small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.btn{width:100%;height:60px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:800;margin-top:22px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--soft);color:var(--ink);margin-top:10px}
.btn.danger{background:transparent;color:var(--danger);margin-top:8px;height:52px}
.btn.danger.arm{background:var(--danger);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;
  transition:all .25s;z-index:20;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="left">
      <a class="back" href="index.html?v=2" aria-label="Orqaga">‹</a>
      <div>
        <div class="date" id="today"></div>
        <h1>Odatlarim</h1>
      </div>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Rejimni almashtirish">🌙</button>
  </div>

  <div class="summary" id="summary" hidden>
    <div class="row"><span class="big" id="sumText"></span><small id="sumSub"></small></div>
    <div class="bar"><i id="sumBar"></i></div>
  </div>

  <p class="note" id="note" hidden></p>
  <div class="list" id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<button class="fab" id="addBtn"><i>+</i> Odat qo'shish</button>

<div class="backdrop" id="backdrop"></div>

<!-- add / edit sheet -->
<form class="sheet" id="habitSheet" autocomplete="off">
  <div class="grab"></div>
  <h2 id="habitTitle">Yangi odat</h2>
  <label class="lbl" for="fName">Nomi</label>
  <input class="text" id="fName" maxlength="40" placeholder="Masalan: Suv ichish" required>
  <label class="lbl">Emoji</label>
  <div class="emojis" id="emojiGrid"></div>
  <div class="custom"><input class="text" id="fEmoji" maxlength="4" aria-label="O'z emojingiz"><small>Yoki o'zingiz emoji yozing</small></div>
  <label class="lbl">Kunlik maqsad</label>
  <div class="stepper">
    <button type="button" id="gMinus" aria-label="Kamaytirish">−</button>
    <div class="val"><span id="gVal">1</span><small id="gHint">marta kuniga</small></div>
    <button type="button" id="gPlus" aria-label="Oshirish">+</button>
  </div>
  <button class="btn" type="submit" id="saveBtn">Saqlash</button>
  <button class="btn danger" type="button" id="delBtn" hidden>Odatni o'chirish</button>
</form>

<!-- day edit sheet -->
<div class="sheet" id="daySheet">
  <div class="grab"></div>
  <h2 id="dayTitle"></h2>
  <div class="stepper">
    <button type="button" id="dMinus" aria-label="Kamaytirish">−</button>
    <div class="val"><span id="dVal">0</span><small id="dHint"></small></div>
    <button type="button" id="dPlus" aria-label="Oshirish">+</button>
  </div>
  <button class="btn" type="button" id="dDone">Tayyor</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const WD = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const MO = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const EMOJIS = ["💧","🏃","📚","🧘","💪","🥗","😴","🕌","🤲","✍️","🚶","🦷","🍎","☀️","🧠","🎯","💻","🚭"];

const S = {
  habits: [], loaded: false,
  today: dkey(new Date()),
};

/* ---------- utils ---------- */
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function prettyDate(d){return d.getDate()+"-"+MO[d.getMonth()]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- theme ---------- */
function getTheme(){try{return localStorage.getItem("odat-theme")}catch(e){return null}}
function applyTheme(t){
  const sys = window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  const th = t||sys;
  document.documentElement.dataset.theme = th;
  $("themeBtn").textContent = th==="dark"?"☀️":"🌙";
  document.querySelector('meta[name=theme-color]').content = th==="dark"?"#111312":"#f6f5f1";
}
applyTheme(getTheme());
$("themeBtn").onclick=()=>{
  const next = document.documentElement.dataset.theme==="dark"?"light":"dark";
  try{localStorage.setItem("odat-theme",next)}catch(e){}
  applyTheme(next);
};

/* ---------- habit math ---------- */
function goalOf(h){return Math.max(1,Number(h.goal)||1)}
function countOf(h,key){
  return Number(h.log&&h.log[key])||0;
}
function doneOn(h,key){return countOf(h,key)>=goalOf(h)}
function streakOf(h){
  let d=new Date(); let n=0;
  if(!doneOn(h,dkey(d))) d=addDays(d,-1);        // bugun hali belgilanmagan bo'lsa ham streak uzilmaydi
  while(doneOn(h,dkey(d))){n++;d=addDays(d,-1); if(n>3650)break}
  return n;
}
function bestOf(h){
  const keys=Object.keys(h.log||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
  if(!keys.length) return 0;
  let best=0,cur=0,d=parseKey(keys[0]);const end=new Date();let guard=0;
  while(dkey(d)<=dkey(end)&&guard++<4000){ if(doneOn(h,dkey(d))){cur++;best=Math.max(best,cur)}else cur=0; d=addDays(d,1)}
  return best;
}
function level(h,key){
  const c=countOf(h,key), g=goalOf(h);
  if(c<=0) return 0; if(c>=g) return 4;
  const r=c/g; return r<.34?1:r<.67?2:3;
}

/* ---------- storage ---------- */
const LKEY="odat-local-v1";
function localLoad(){try{return JSON.parse(localStorage.getItem(LKEY)||"{}")}catch(e){return {}}}
function localSave(obj){try{localStorage.setItem(LKEY,JSON.stringify(obj))}catch(e){toast("Brauzer xotirasiga yozib bo'lmadi")}}
function localRefresh(){
  const obj=localLoad();
  S.habits=Object.entries(obj).map(([id,v])=>({id,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  S.loaded=true; render();
}

/* Firebase: users/<telegram_id>/habits — boshqa qurilmalarda ham saqlanadi.
   localStorage tezkor kesh sifatida qoladi (oflaynda ham ishlaydi). */
const FB_CONFIG = {
  apiKey: "AIzaSyBuaSb9rso27Ul3uEIzZR0rp8VUswI8CtI",
  databaseURL: "https://bellashuv-a7b16-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bellashuv-a7b16"
};
let remote=null;
function remoteWrite(fn){
  if(!remote) return;
  try{ Promise.resolve(fn(remote)).catch(()=>toast("Bulutga saqlab bo'lmadi — internetni tekshiring")) }catch(e){}
}

async function setCount(h,key,n){
  n=Math.max(0,Math.min(999,n));
  const obj=localLoad(); if(!obj[h.id])return;
  obj[h.id].log=obj[h.id].log||{}; obj[h.id].log[key]=n; localSave(obj); localRefresh();
  remoteWrite(r=>r.child(h.id+"/log/"+key).set(n));
}
async function createHabit(data){
  const body={...data,log:{},createdAt:Date.now()};
  const id="h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const obj=localLoad(); obj[id]=body; localSave(obj); localRefresh();
  remoteWrite(r=>r.child(id).set(body));
  return true;
}
async function updateHabit(id,data){
  const obj=localLoad(); if(obj[id]){Object.assign(obj[id],data);localSave(obj);localRefresh()}
  remoteWrite(r=>r.child(id).update(data));
  return true;
}
async function deleteHabit(id){
  const obj=localLoad(); delete obj[id]; localSave(obj); localRefresh();
  remoteWrite(r=>r.child(id).remove());
}

function startSync(){
  const note=$("note");
  const showNote=t=>{note.hidden=false;note.textContent=t};
  let tgUser=null;
  try{tgUser=Telegram.WebApp.initDataUnsafe.user||null}catch(e){}
  if(!tgUser||!tgUser.id){showNote("Telegram orqali ochilmagan — odatlar faqat shu qurilmada saqlanadi.");return}
  if(typeof firebase==="undefined"){showNote("Bulutga ulanib bo'lmadi — odatlar hozircha shu qurilmada saqlanadi.");return}
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    remote=firebase.database().ref("users/"+tgUser.id+"/habits");
  }catch(e){showNote("Bulutga ulanib bo'lmadi — odatlar hozircha shu qurilmada saqlanadi.");return}
  const SYNC_KEY="odat-synced-"+tgUser.id;
  let synced=false; try{synced=localStorage.getItem(SYNC_KEY)==="1"}catch(e){}
  remote.on("value",snap=>{
    const val=snap.val();
    if(!synced){
      synced=true; try{localStorage.setItem(SYNC_KEY,"1")}catch(e){}
      // Birinchi marta: shu qurilmadagi odatlarni bulutdagilar bilan birlashtirish
      const local=localLoad();
      const merged={...local,...(val||{})};
      if(Object.keys(local).some(k=>!(val&&val[k]))) remote.set(merged).catch(()=>{});
      localSave(merged); localRefresh(); return;
    }
    localSave(val||{}); localRefresh();
    if(openSheet===$("daySheet")&&dayCtx) paintDay();
  },()=>{
    remote=null;
    showNote("Bulutdagi ma'lumotlarni o'qib bo'lmadi — odatlar hozircha shu qurilmada saqlanadi.");
  });
}

/* ---------- render ---------- */
function renderHeader(){
  const d=new Date();
  $("today").textContent=WD[d.getDay()]+", "+prettyDate(d);
  const hs=S.habits;
  if(!hs.length){$("summary").hidden=true;return}
  $("summary").hidden=false;
  const done=hs.filter(h=>doneOn(h,S.today)).length;
  $("sumText").textContent= done===hs.length?"🎉 Hammasi bajarildi!":"Bugun: "+done+" / "+hs.length;
  $("sumSub").textContent= done===hs.length?"Zo'r kun":(hs.length-done)+" ta qoldi";
  $("sumBar").style.width=(hs.length?done/hs.length*100:0)+"%";
}
function render(){
  renderHeader();
  const list=$("list");
  if(!S.loaded){list.innerHTML='<div class="empty"><div class="e">⏳</div><b>Yuklanmoqda…</b></div>';return}
  if(!S.habits.length){
    list.innerHTML='<div class="empty"><div class="e">🌱</div><b>Hali odat yo\'q</b>Pastdagi tugma bilan birinchi odatingizni qo\'shing.</div>';
    return;
  }
  const now=new Date();
  list.innerHTML=S.habits.map(h=>{
    const g=goalOf(h), c=countOf(h,S.today), done=c>=g, st=streakOf(h);
    const created=h.createdAt?dkey(new Date(h.createdAt)):null;
    let cells="";
    for(let i=29;i>=0;i--){
      const k=dkey(addDays(now,-i)), lv=level(h,k);
      const cls=["cell"]; if(lv) cls.push("l"+lv); if(i===0) cls.push("today");
      if(created && k<created && !lv) cls.push("before");
      cells+=`<button class="${cls.join(" ")}" data-day="${h.id}" data-key="${k}" aria-label="${prettyDate(parseKey(k))}: ${countOf(h,k)}/${g}"></button>`;
    }
    const label = g===1 ? (done?"✓ Bajarildi":"Belgilash") : (done?"✓ "+c+" / "+g:c+" / "+g+"  ·  +1");
    const minus = (g>1 && c>0) ? `<button class="minus" data-minus="${h.id}" aria-label="Bittaga kamaytirish">−</button>` : "";
    return `<article class="card">
      <div class="head">
        <button class="meta" data-edit="${h.id}">
          <span class="emoji">${esc(h.emoji||"✨")}</span>
          <span style="min-width:0"><b>${esc(h.name)}</b><small>${g===1?"Kuniga 1 marta":"Kuniga "+g+" marta"} · tahrirlash</small></span>
        </button>
        <div class="streak ${st?"on":""}"><b>🔥 ${st}</b><small>rekord ${Math.max(st,bestOf(h))}</small></div>
      </div>
      <div class="actions">
        <button class="check ${done?"done":""}" data-tap="${h.id}"><i class="fill" style="width:${Math.min(100,c/g*100)}%"></i><span>${label}</span></button>
        ${minus}
      </div>
      <div class="heat">${cells}</div>
      <div class="heatlbl"><span>30 kun oldin</span><span>Bugun</span></div>
    </article>`;
  }).join("");
}

/* ---------- interactions ---------- */
const byId=id=>S.habits.find(h=>h.id===id);
$("list").addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.tap){
    const h=byId(t.dataset.tap); if(!h)return; const g=goalOf(h), c=countOf(h,S.today);
    buzz();
    if(g===1) setCount(h,S.today,c>=1?0:1);
    else if(c<g){ setCount(h,S.today,c+1); if(c+1===g) toast((h.emoji||"✨")+" Bugungi maqsad bajarildi!"); }
    else toast("Maqsad bajarilgan. Kamaytirish uchun − tugmasi");
  } else if(t.dataset.minus){
    const h=byId(t.dataset.minus); if(!h)return; buzz(); setCount(h,S.today,countOf(h,S.today)-1);
  } else if(t.dataset.edit){
    openHabitSheet(byId(t.dataset.edit));
  } else if(t.dataset.day){
    openDaySheet(byId(t.dataset.day),t.dataset.key);
  }
});

/* sheets */
let openSheet=null;
function showSheet(el){openSheet=el;$("backdrop").classList.add("open");el.classList.add("open")}
function closeSheet(){if(openSheet)openSheet.classList.remove("open");$("backdrop").classList.remove("open");openSheet=null}
$("backdrop").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

let form={id:null,emoji:"💧",goal:1};
const grid=$("emojiGrid");
grid.innerHTML=EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("");
grid.onclick=e=>{const b=e.target.closest("button");if(!b)return;form.emoji=b.dataset.e;$("fEmoji").value="";paintForm()};
$("fEmoji").oninput=e=>{const v=e.target.value.trim();if(v)form.emoji=v;paintForm()};
$("gMinus").onclick=()=>{form.goal=Math.max(1,form.goal-1);paintForm()};
$("gPlus").onclick=()=>{form.goal=Math.min(50,form.goal+1);paintForm()};
$("fName").oninput=paintForm;
function paintForm(){
  [...grid.children].forEach(b=>b.classList.toggle("sel",b.dataset.e===form.emoji));
  $("gVal").textContent=form.goal;
  $("gHint").textContent=form.goal===1?"marta kuniga":"marta kuniga";
  $("saveBtn").disabled=!$("fName").value.trim();
}
function openHabitSheet(h){
  form={id:h?h.id:null,emoji:h?(h.emoji||"✨"):"💧",goal:h?goalOf(h):1};
  $("habitTitle").textContent=h?"Odatni tahrirlash":"Yangi odat";
  $("fName").value=h?h.name:"";
  $("fEmoji").value=(h&&!EMOJIS.includes(h.emoji))?(h.emoji||""):"";
  $("saveBtn").textContent=h?"Saqlash":"Qo'shish";
  const del=$("delBtn"); del.hidden=!h; del.classList.remove("arm"); del.textContent="Odatni o'chirish";
  paintForm(); showSheet($("habitSheet"));
  if(!h) setTimeout(()=>$("fName").focus(),250);
}
$("addBtn").onclick=()=>openHabitSheet(null);
$("habitSheet").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("fName").value.trim(); if(!name)return;
  const data={name,emoji:form.emoji||"✨",goal:form.goal};
  $("saveBtn").disabled=true;
  const ok = form.id ? await updateHabit(form.id,data) : await createHabit(data);
  $("saveBtn").disabled=false;
  if(ok){closeSheet(); if(!form.id) toast(data.emoji+" «"+name+"» qo'shildi")}
});
$("delBtn").onclick=async()=>{
  const b=$("delBtn");
  if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Rostdan o'chirilsinmi? Yana bosing";return}
  const id=form.id; closeSheet(); await deleteHabit(id); toast("Odat o'chirildi");
};

/* day sheet (o'tgan kunlarni tuzatish) */
let dayCtx=null;
function paintDay(){
  const h=byId(dayCtx.id); if(!h)return closeSheet();
  const c=countOf(h,dayCtx.key), g=goalOf(h);
  $("dVal").textContent=c+" / "+g;
  $("dHint").textContent=c>=g?"✓ bajarilgan":"bajarilmagan";
}
function openDaySheet(h,key){
  if(!h)return; dayCtx={id:h.id,key};
  const isToday=key===S.today;
  $("dayTitle").textContent=(h.emoji||"✨")+" "+h.name+" — "+(isToday?"bugun":prettyDate(parseKey(key)));
  paintDay(); showSheet($("daySheet"));
}
$("dMinus").onclick=()=>{const h=byId(dayCtx.id);if(!h)return;buzz();setCount(h,dayCtx.key,countOf(h,dayCtx.key)-1);paintDay()};
$("dPlus").onclick=()=>{const h=byId(dayCtx.id);if(!h)return;buzz();setCount(h,dayCtx.key,Math.min(goalOf(h)*3,countOf(h,dayCtx.key)+1));paintDay()};
$("dDone").onclick=closeSheet;

/* kun almashsa (yarim tun) qayta chizish */
setInterval(()=>{const k=dkey(new Date()); if(k!==S.today){S.today=k;render()}},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){S.today=dkey(new Date());render()}});

/* ---------- boot ---------- */
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
localRefresh();
startSync();
})();
</script>
</body>
</html>
