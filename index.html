<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopikGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f7fb; --card:#ffffff; --text:#1d2433; --muted:#6b7385; --accent:#2f6fdd; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px 24px;
  }
  .logo { display: block; width: 190px; max-width: 70%; height: auto; margin: 0 auto 0; }
  p.sub { margin: -10px 0 24px; color: var(--muted); font-size: 14px; }
  .menu { width: 100%; max-width: 420px; display: grid; gap: 12px; }
  .btn {
    display: block; text-decoration: none; background: var(--accent); color: #fff;
    padding: 18px 20px; border-radius: 16px; font-size: 17px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(47,111,221,.25); text-align: center;
  }
  .btn small { display: block; font-weight: 400; font-size: 13px; opacity: .85; margin-top: 4px; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="TopikGo" width="260">
  <p class="sub">Koreys tili lug'ati</p>
  <nav class="menu">
    <a class="btn" href="topik-sozlar.html">Topik so'zlar<small>Kartochka va test rejimlari</small></a>
  </nav>
  <script>
    try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
  </script>
</body>
</html>
