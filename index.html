<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopikGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f7fb; --card:#ffffff; --text:#1d2433; --muted:#6b7385; --accent:#2f6fdd; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px 24px;
  }
  .logo { display: block; width: 190px; max-width: 70%; height: auto; margin: 0 auto 0; }
  p.sub { margin: -10px 0 24px; color: var(--muted); font-size: 14px; }
  .menu { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
    min-height: 96px; padding: 18px 12px; border: 2px solid; border-radius: 22px; text-align: center;
    text-decoration: none; font-family: inherit; font-size: 18px; cursor: pointer; background: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tile .t-title { font-size: 18px; font-weight: 500; }
  .tile small { font-size: 12px; font-weight: 400; }
  .tile:active { transform: translateY(4px); }
  .tile-purple { background: #EEEDFE; color: #26215C; border-color: #AFA9EC; box-shadow: 0 6px 0 #CECBF6; }
  .tile-purple small { color: #534AB7; }
  .tile-green { background: #E1F5EE; color: #04342C; border-color: #5DCAA5; box-shadow: 0 6px 0 #9FE1CB; }
  .tile-green small { color: #0F6E56; }
  .tile-blue { background: #E6F1FB; color: #042C53; border-color: #85B7EB; box-shadow: 0 6px 0 #B5D4F4; }
  .tile-blue small { color: #185FA5; }
  .tile-coral { background: #FAECE7; color: #4A1B0C; border-color: #F0997B; box-shadow: 0 6px 0 #F5C4B3; }
  .tile-coral small { color: #993C1D; }
  .tile-wide { grid-column: 1 / -1; }
  .sub { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sub[hidden] { display: none !important; }
  .btn {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    text-decoration: none; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .2px;
    padding: 22px 18px 22px 26px; border-radius: 28px; overflow: hidden;
    background: linear-gradient(90deg, #005ae6, #00bfff);
    box-shadow: 0 10px 0 #0a2878, 0 0 18px rgba(0,170,255,.55), inset 0 1px 0 rgba(255,255,255,.45);
    border: 2px solid rgba(150,235,255,.9);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 6px; height: 46%;
    border-radius: 22px; background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.05));
    pointer-events: none;
  }
  .btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #0a2878, 0 0 14px rgba(0,170,255,.4); }
  .btn-yellow {
    background: linear-gradient(90deg, #f2b705, #ffd21f); color: #2b1d00;
    box-shadow: 0 10px 0 #8a6200, 0 0 18px rgba(255,200,0,.55), inset 0 1px 0 rgba(255,255,255,.55);
    border: 2px solid rgba(255,240,170,.95);
  }
  .btn-yellow:active { box-shadow: 0 4px 0 #8a6200, 0 0 14px rgba(255,200,0,.4); }
  .btn-yellow .btn-arrow { background: #fff8d6; color: #8a6200; border-color: #ffe27a; }
  .btn small { display: block; font-size: 13px; font-weight: 600; opacity: .85; margin-top: 4px; }
  .btn-arrow {
    position: relative; width: 44px; height: 44px; border-radius: 50%; flex: 0 0 44px;
    display: grid; place-items: center; background: #e6f8ff; color: #005ae6; font-size: 26px; font-weight: 700;
    border: 2px solid #96ebff;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: url('bg-logo.png') no-repeat center 55% / min(88%, 520px) auto;
    opacity: .22;
  }
  button.btn { width: 100%; font-family: inherit; cursor: pointer; border-style: solid; text-align: left; }
  button.btn > span:first-child { flex: 1; text-align: left; }
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none;
    transition: opacity .25s ease; z-index: 10;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: 0; height: 100%; width: min(86%, 380px);
    background: var(--bg); transform: translateX(-100%); transition: transform .3s ease;
    z-index: 11; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 6px 0 24px rgba(0,0,0,.15); overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .btn { font-size: 14px; padding: 12px 12px 12px 16px; border-radius: 18px; box-shadow: 0 5px 0 rgba(0,0,0,.18) !important; }
  .drawer .btn small { font-size: 11px; margin-top: 2px; }
  .drawer .btn-arrow { width: 30px; height: 30px; flex: 0 0 30px; font-size: 18px; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; font-size: 18px; }
  .drawer-close {
    border: none; background: var(--card); width: 36px; height: 36px; border-radius: 50%;
    font-size: 20px; cursor: pointer; color: var(--text);
  }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="TopikGo" width="260">
  <p class="sub">Koreys tili lug'ati</p>
  <nav class="menu">
    <button class="tile tile-purple" id="openDrawer" type="button"><span class="t-title">Lug'atlar</span><small>Essential · Hancha</small></button>
    <a class="tile tile-green" href="gaplashish.html?v=1"><span class="t-title">Gaplashish</span><small>회화 · suhbat</small></a>
    <button class="tile tile-blue tile-wide" id="openTopik" type="button" aria-expanded="false" aria-controls="topikSub"><span class="t-title">TOPIK Test</span><small>Daraja tanlang</small></button>
    <div class="sub" id="topikSub" hidden>
      <a class="tile tile-blue" href="beginner.html?v=1"><span class="t-title">TOPIK I</span><small>Boshlang'ich daraja</small></a>
      <a class="tile tile-purple" href="beginner.html?v=1"><span class="t-title">TOPIK II</span><small>Yuqori daraja</small></a>
    </div>
    <a class="tile tile-coral" href="#"><span class="t-title">TOPIK Darslik</span><small>1 dan 6 gacha</small></a>
  </nav>

  <div class="drawer-overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Lug'atlar">
    <div class="drawer-head">
      <span>Lug'atlar</span>
      <button class="drawer-close" id="closeDrawer" type="button" aria-label="Yopish">×</button>
    </div>
    <a class="btn" href="topik-sozlar.html?v=3"><span>TOPIK II · Lug'at</span><span class="btn-arrow">›</span></a>
    <a class="btn btn-yellow" href="essential.html?v=3"><span>Essential Korean Words 2000<small>Boshlang'ich · O'rta · Yuqori</small></span><span class="btn-arrow">›</span></a>
    <a class="btn" href="hancha.html?v=16" style="background:linear-gradient(90deg,#1f4e78,#3d7fb5);box-shadow:0 10px 0 #0d2a44;"><span>2000 hancha so'zlar<small>한자 어휘 2000</small></span><span class="btn-arrow">›</span></a>
    <a class="btn" href="topik.html?v=1" style="background:linear-gradient(90deg,#534AB7,#7F77DD);box-shadow:0 5px 0 #26215C !important;"><span>TOPIK<small>3 daraja</small></span><span class="btn-arrow">›</span></a>
  </aside>

  <script>
    try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}

    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    function setDrawer(open) {
      drawer.classList.toggle('open', open);
      overlay.classList.toggle('open', open);
    }
    document.getElementById('openDrawer').onclick = () => setDrawer(true);
    document.getElementById('closeDrawer').onclick = () => setDrawer(false);
    overlay.onclick = () => setDrawer(false);
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    let popCtx = null;
    function playPop() {
      try {
        if (!popCtx) popCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (popCtx.state === 'suspended') popCtx.resume();
        const t0 = popCtx.currentTime;
        const osc = popCtx.createOscillator();
        const gain = popCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, t0);
        osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.08);
        gain.gain.setValueAtTime(0.5, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
        osc.connect(gain).connect(popCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.09);
      } catch (e) {}
    }
    window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
    const openTopik = document.getElementById('openTopik');
    const topikSub = document.getElementById('topikSub');
    openTopik.addEventListener('click', () => {
      const open = topikSub.hasAttribute('hidden');
      topikSub.toggleAttribute('hidden', !open);
      openTopik.setAttribute('aria-expanded', String(open));
    });
    document.querySelectorAll('.btn, .tile').forEach(el => {
      el.addEventListener('click', e => {
        playPop();
        if (el.tagName === 'A') {
          e.preventDefault();
          const href = el.getAttribute('href');
          if (href && href !== '#') setTimeout(() => { window.location.href = href; }, 120);
        }
      });
    });
  </script>
</body>
</html>
